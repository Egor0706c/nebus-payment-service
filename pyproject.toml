[project]
name = "nebus-payment-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "pydantic-settings>=2,<3", "sqlalchemy[asyncio]>=2,<3", "asyncpg>=0.30,<1", "faststream[rabbit,cli]>=0.6,<0.7", "alembic>=1.15,<2", "httpx>=0.28,<1", "uvicorn>=0.34,<1"]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
[tool.ruff]
line-length = 100
