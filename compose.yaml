name: nebus-payments
x-app: &app
  build: .
  environment: &env
    API_KEY: ${API_KEY:-local-demo-change-me}
    DATABASE_URL: postgresql+asyncpg://payments:payments@postgres:5432/payments
    RABBITMQ_URL: amqp://payments:payments@rabbitmq:5672/
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 2s
      timeout: 3s
      retries: 30
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: payments
      RABBITMQ_DEFAULT_PASS: payments
    ports: ["127.0.0.1:5673:5672", "127.0.0.1:15673:15672"]
    volumes: ["rabbitdata:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
  api:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
  consumer:
    <<: *app
    command: ["faststream", "run", "app.worker:app"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    stop_grace_period: 45s
volumes:
  pgdata:
  rabbitdata:
